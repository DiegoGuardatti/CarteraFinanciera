[pytest]
minversion = 6.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    api: API tests
    metrics: Financial metrics tests
    database: Database tests

[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */.tox/*
    .tox/*
    setup.py
    instance/*