# docker-compose.dev.yml - Configuración de desarrollo
# OPTIMIZADO: Límites de memoria y configuración de Gunicorn ajustados
version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: cartera-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootDevPass123!
      MYSQL_DATABASE: CarteraFinanciera
      MYSQL_USER: cartera_user
      MYSQL_PASSWORD: RootDevPass123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootDevPass123!"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: cartera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru

  app:
    build: .
    container_name: cartera-app
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      SECRET_KEY: cartera-dev-secret
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: cartera_user
      DB_PASSWORD: RootDevPass123!
      DB_NAME: CarteraFinanciera
      DATABASE_URL: mysql+pymysql://cartera_user:RootDevPass123!@db:3306/CarteraFinanciera
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      # Gunicorn settings via environment
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "1"
      GUNICORN_TIMEOUT: "120"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  mysql_data:
  redis_data: