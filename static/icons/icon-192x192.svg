<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="url(#grad1)" stroke="#fff" stroke-width="4"/>
  
  <!-- Chart icon -->
  <g transform="translate(40, 50)" fill="#fff">
    <!-- Grid lines -->
    <line x1="0" y1="80" x2="112" y2="80" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="60" x2="112" y2="60" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="40" x2="112" y2="40" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="20" x2="112" y2="20" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Chart bars -->
    <rect x="10" y="40" width="8" height="40" rx="2"/>
    <rect x="30" y="20" width="8" height="60" rx="2"/>
    <rect x="50" y="30" width="8" height="50" rx="2"/>
    <rect x="70" y="15" width="8" height="65" rx="2"/>
    <rect x="90" y="25" width="8" height="55" rx="2"/>
    
    <!-- Trend line -->
    <polyline points="14,60 34,40 54,50 74,35 94,45" 
              fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Trend arrow -->
    <polygon points="90,35 94,45 98,42" fill="#fff"/>
  </g>
</svg>