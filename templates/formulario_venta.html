<!-- Mensaje de ayuda -->
<div class="alert alert-info d-flex align-items-center mb-4" role="alert">
    <i class="fas fa-info-circle me-2" aria-hidden="true"></i>
    <div>
        <strong>Instrucciones:</strong> Seleccione el broker, comitente e instrumento para ver las compras disponibles y registrar una venta.
    </div>
</div>

<!-- Filtros de búsqueda -->
<div class="row mb-4">
    <div class="col-lg-6 mb-3">
        <label for="Broker" class="form-label fw-bold">
            <i class="fas fa-building me-1" aria-hidden="true"></i>
            Broker
            <span class="text-danger" aria-label="obligatorio">*</span>
        </label>
        <select class="form-select form-select-lg shadow-sm" id="Broker" name="Id_Broker" required>
            <option value="">Seleccionar broker...</option>
            {% for broker in brokers %}
            <option value="{{ broker.Id_Broker }}">{{ broker.Nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-lg-6 mb-3">
        <label for="Comitente" class="form-label fw-bold">
            <i class="fas fa-user me-1" aria-hidden="true"></i>
            Comitente
            <span class="text-danger" aria-label="obligatorio">*</span>
        </label>
        <select class="form-select form-select-lg shadow-sm" id="Comitente" name="Id_Comitente" required>
            <!-- Se llena dinámicamente -->
        </select>
    </div>
</div>

<div class="row mb-4">
    <div class="col-lg-6 mb-3">
        <label for="tipoInstrumento" class="form-label fw-bold">
            <i class="fas fa-chart-line me-1" aria-hidden="true"></i>
            Instrumento Financiero
            <span class="text-danger" aria-label="obligatorio">*</span>
        </label>
        <select class="form-select form-select-lg shadow-sm" id="tipoInstrumento" name="Id_InstrumentoFinanciero" required>
            <option value="">Seleccionar instrumento...</option>
            {% for instrumento in InstrumentoFinancieros %}
            <option value="{{ instrumento.Id_InstrumentoFinanciero }}">{{ instrumento.Nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-lg-6 mb-3">
        <label for="tickernombre" class="form-label fw-bold">
            <i class="fas fa-hashtag me-1" aria-hidden="true"></i>
            Ticker
            <span class="text-danger" aria-label="obligatorio">*</span>
        </label>
        <select class="form-select form-select-lg shadow-sm" id="tickernombre" name="Id_Ticker" required>
            <!-- Se llena dinámicamente -->
        </select>
    </div>
</div>

<div class="row mb-4">
    <div class="col-12">
        <label for="descripcionTicker" class="form-label fw-bold">
            <i class="fas fa-info-circle me-1" aria-hidden="true"></i>
            Descripción del Activo
        </label>
        <input type="text" class="form-control form-control-lg shadow-sm" id="descripcionTicker" readonly 
               placeholder="Se completará automáticamente al seleccionar el ticker">
    </div>
</div>

<!-- Tabla de compras disponibles -->
<div class="card border-0 bg-light">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">
            <i class="fas fa-table me-2" aria-hidden="true"></i>
            Compras Disponibles para Venta
        </h2>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr>
                        <th><i class="fas fa-calendar me-1"></i>Fecha Hora</th>
                        <th><i class="fas fa-tag me-1"></i>Precio Compra</th>
                        <th><i class="fas fa-sort-numeric-up me-1"></i>Cantidad</th>
                        <th><i class="fas fa-coins me-1"></i>Total Dólares</th>
                        <th><i class="fas fa-money-bill-wave me-1"></i>Total Pesos</th>
                        <th><i class="fas fa-cogs me-1"></i>Acciones</th>
                    </tr>
                </thead>
                <tbody id="comprasTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted">
                            <i class="fas fa-info-circle me-2"></i>
                            Seleccione un ticker para ver las compras disponibles
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal de venta -->
<div class="modal fade" id="ventaModal" tabindex="-1" aria-labelledby="ventaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-gradient text-white">
                <h5 class="modal-title" id="ventaModalLabel">
                    <i class="fas fa-chart-line me-2"></i>Registrar Venta
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="ventaForm">
                    <input type="hidden" name="Id_Activo" id="Id_Activo">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-calendar-alt me-1"></i>Fecha y Hora
                                <span class="text-danger">*</span>
                            </label>
                            <input type="datetime-local" class="form-control form-control-lg" name="Fecha_Hora_Venta" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-tag me-1"></i>Precio Venta (ARS)
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" class="form-control form-control-lg" id="PrecioVenta" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-dollar-sign me-1"></i>Dólar MEP
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" class="form-control form-control-lg" id="PrecioDolarMEPVenta" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-sort-numeric-up me-1"></i>Cantidad
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="any" class="form-control form-control-lg" id="cantidadVenta" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-money-bill-wave me-1"></i>Total Pesos
                            </label>
                            <input type="text" class="form-control form-control-lg bg-light" id="totalPesosVenta" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                <i class="fas fa-coins me-1"></i>Total Dólares
                            </label>
                            <input type="text" class="form-control form-control-lg bg-light" id="totalDolaresVenta" readonly>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times me-1"></i>Cancelar
                </button>
                <button type="submit" form="ventaForm" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Registrar Venta
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // JavaScript mínimo usando las funciones de funciones.js
    document.addEventListener('DOMContentLoaded', function () {
        // Configurar eventos para broker
        const brokerSelect = document.getElementById('Broker');
        if (brokerSelect) {
            brokerSelect.addEventListener('change', function() {
                if (typeof updateComitentes === 'function') {
                    updateComitentes(this.value);
                }
            });
        }

        // Configurar eventos para instrumento
        const instrumentoSelect = document.getElementById('tipoInstrumento');
        if (instrumentoSelect) {
            instrumentoSelect.addEventListener('change', function() {
                if (typeof updateTickers === 'function') {
                    updateTickers(this.value);
                }
            });
        }

        // Configurar eventos para ticker
        const tickerSelect = document.getElementById('tickernombre');
        if (tickerSelect) {
            tickerSelect.addEventListener('change', function() {
                if (typeof updateTickerDescription === 'function') {
                    updateTickerDescription();
                }
                if (this.value) {
                    cargarCompras(this.value);
                }
            });
        }

        // Función para cargar compras (específica de venta)
        function cargarCompras(tickerId) {
            const tablaBody = document.getElementById('comprasTableBody');
            if (!tablaBody) return;

            tablaBody.innerHTML = '<tr><td colspan="6" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div>Cargando compras...</td></tr>';
            
            fetch(`/get_compras/${tickerId}`)
                .then(response => response.json())
                .then(data => {
                    tablaBody.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(c => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${new Date(c.Fecha_Hora_Compra).toLocaleString('es-AR')}</td>
                                <td>${parseFloat(c.Precio_Compra).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                                <td>${parseFloat(c.Cantidad_Nominales_Compra).toLocaleString('es-AR')}</td>
                                <td>US${parseFloat(c.Total_Dolares_Compra).toLocaleString('es-AR', {minimumFractionDigits: 3})}</td>
                                <td>${parseFloat(c.Total_Pesos_Compra).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" 
                                           data-bs-toggle="modal"
                                           data-bs-target="#ventaModal"
                                           data-id-activo="${c.Id_Activo}">
                                        <i class="fas fa-chart-line me-1"></i>Registrar Venta
                                    </button>
                                </td>
                            `;
                            tablaBody.appendChild(tr);
                        });
                    } else {
                        tablaBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted"><i class="fas fa-info-circle me-2"></i>No hay compras disponibles para este ticker</td></tr>';
                    }
                })
                .catch(error => {
                    console.error('Error cargando compras:', error);
                    tablaBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Error al cargar las compras</td></tr>';
                });
        }

        // Modal events
        const ventaModal = document.getElementById('ventaModal');
        if (ventaModal) {
            ventaModal.addEventListener('show.bs.modal', function (e) {
                const btn = e.relatedTarget;
                const id = btn.getAttribute('data-id-activo');
                const idActivoInput = document.getElementById('Id_Activo');
                if (idActivoInput) {
                    idActivoInput.value = id;
                }
            });
        }

        // Cálculo de venta
        function calcularVenta() {
            const precioVenta = parseFloat(document.getElementById('PrecioVenta')?.value) || 0;
            const dolarMEP = parseFloat(document.getElementById('PrecioDolarMEPVenta')?.value) || 0;
            const cantidad = parseFloat(document.getElementById('cantidadVenta')?.value) || 0;
            
            const totalPesos = precioVenta * cantidad;
            const totalDolares = dolarMEP > 0 ? totalPesos / dolarMEP : 0;
            
            const totalPesosInput = document.getElementById('totalPesosVenta');
            const totalDolaresInput = document.getElementById('totalDolaresVenta');
            
            if (totalPesosInput) {
                totalPesosInput.value = totalPesos.toLocaleString('es-AR', {minimumFractionDigits: 2});
            }
            if (totalDolaresInput) {
                totalDolaresInput.value = totalDolares.toLocaleString('es-AR', {minimumFractionDigits: 3});
            }
        }

        ['PrecioVenta', 'PrecioDolarMEPVenta', 'cantidadVenta'].forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('input', calcularVenta);
                input.addEventListener('blur', calcularVenta);
            }
        });

        // Enviar venta
        const ventaForm = document.getElementById('ventaForm');
        if (ventaForm) {
            ventaForm.addEventListener('submit', function (e) {
                e.preventDefault();
                
                const data = {
                    Id_Activo: document.getElementById('Id_Activo')?.value,
                    Fecha_Hora_Venta: this.Fecha_Hora_Venta?.value,
                    PrecioVenta: this.PrecioVenta?.value,
                    PrecioDolarMEPVenta: this.PrecioDolarMEPVenta?.value,
                    CantidadVenta: this.cantidadVenta?.value,
                    Total_Pesos_Venta: document.getElementById('totalPesosVenta')?.value,
                    Total_Dolares_Venta: document.getElementById('totalDolaresVenta')?.value
                };

                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';
                submitBtn.disabled = true;

                fetch('/registrar_venta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(res => {
                    alert(res.message || 'Venta registrada exitosamente');
                    const modal = bootstrap.Modal.getInstance(ventaModal);
                    if (modal) modal.hide();
                    ventaForm.reset();
                    location.reload();
                })
                .catch(error => {
                    console.error('Error registrando venta:', error);
                    alert('Error: ' + (error.error || 'Error desconocido al registrar la venta'));
                })
                .finally(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                });
            });
        }

        console.log('✅ Formulario de venta inicializado correctamente');
    });
</script>
