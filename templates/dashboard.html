    <script>
        // Función para formatear números como moneda
        function formatearMoneda(valor) {
            return new Intl.NumberFormat('es-AR', {
                style: 'currency',
                currency: 'ARS',
                minimumFractionDigits: 2
            }).format(valor);
        }

        // Función para formatear porcentajes
        function formatearPorcentaje(valor) {
            return new Intl.NumberFormat('es-AR', {
                style: 'percent',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(valor / 100);
        }

        // Función para obtener clase CSS según el valor
        function getClaseValor(valor, esPorcentaje = false) {
            if (esPorcentaje) {
                return valor > 0 ? 'text-success' : valor < 0 ? 'text-danger' : 'text-muted';
            }
            return valor >= 0 ? 'text-success' : 'text-danger';
        }

        // Cargar KPIs principales
        async function cargarKPIs() {
            try {
                const response = await fetch('/api/metrics/portfolio');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Actualizar timestamp
                document.getElementById('timestamp').textContent = new Date().toLocaleString('es-AR');
                
                // Crear HTML para KPIs
                document.getElementById('kpis-row').innerHTML = `
                    <div class="col-md-3">
                        <div class="card bg-primary text-white shadow">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title mb-1">ROI Cartera</h6>
                                        <h2 class="mb-0">${data.rendimiento_percent}%</h2>
                                        <small class="opacity-75">Ganancia: ${formatearMoneda(data.ganancia)}</small>
                                    </div>
                                    <div>
                                        <i class="fas fa-chart-line fa-2x opacity-75"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white shadow">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title mb-1">Valor Cartera</h6>
                                        <h2 class="mb-0">${formatearMoneda(data.valor_actual)}</h2>
                                        <small class="opacity-75">Inversión: ${formatearMoneda(data.total_inversion)}</small>
                                    </div>
                                    <div>
                                        <i class="fas fa-wallet fa-2x opacity-75"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white shadow">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title mb-1">Distribución</h6>
                                        <h2 class="mb-0">${Object.keys(data.distribucion)[0] || 'N/A'}</h2>
                                        <small class="opacity-75">${Object.values(data.distribucion)[0] || 0}%</small>
                                    </div>
                                    <div>
                                        <i class="fas fa-balance-scale fa-2x opacity-75"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-dark shadow">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title mb-1">Estado</h6>
                                        <h2 class="mb-0">${data.rendimiento_percent >= 0 ? '📈' : '📉'}</h2>
                                        <small class="opacity-75">${data.rendimiento_percent >= 0 ? 'Positivo' : 'Negativo'}</small>
                                    </div>
                                    <div>
                                        <i class="fas fa-exclamation-triangle fa-2x opacity-75"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error cargando KPIs:', error);
                document.getElementById('kpis-row').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            Error cargando KPIs: ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Cargar resumen de portfolio
        async function cargarPortfolioSummary() {
            try {
                const response = await fetch('/api/metrics/portfolio');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                document.getElementById('portfolio-summary').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <h6>Inversión Total</h6>
                                <p class="h4 ${getClaseValor(-data.total_inversion)}">${formatearMoneda(data.total_inversion)}</p>
                            </div>
                            <div class="mb-3">
                                <h6>Valor Actual</h6>
                                <p class="h4 ${getClaseValor(data.valor_actual)}">${formatearMoneda(data.valor_actual)}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <h6>Ganancia Total</h6>
                                <p class="h4 ${getClaseValor(data.ganancia)}">${formatearMoneda(data.ganancia)}</p>
                            </div>
                            <div class="mb-3">
                                <h6>ROI Promedio</h6>
                                <p class="h4 ${getClaseValor(data.rendimiento_percent, true)}">${data.rendimiento_percent}%</p>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <div class="text-center">
                                <span class="badge bg-primary fs-6">${Object.keys(data.distribucion).length} Tipos de Activo</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-center">
                                <span class="badge bg-success fs-6">${Object.entries(data.distribucion).length > 0 ? '100%' : '0%'} Invertido</span>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error cargando portfolio summary:', error);
                document.getElementById('portfolio-summary').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Cargar top performers
        async function cargarTopPerformers() {
            try {
                const response = await fetch('/api/metrics/top-performers?per_page=5');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.top_performers || !Array.isArray(data.top_performers)) {
                    throw new Error('Datos inválidos recibidos');
                }
                
                let html = '<ul class="list-group list-group-flush">';
                
                data.top_performers.forEach((performer, index) => {
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '🏅';
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="me-2">${medal}</span>
                                <strong>${performer.nombre}</strong>
                                <br><small class="text-muted">${performer.tipo}</small>
                            </div>
                            <span class="badge bg-success rounded-pill">${performer.rendimiento.toFixed(2)}%</span>
                        </li>
                    `;
                });
                
                html += '</ul>';
                document.getElementById('top-performers').innerHTML = html;
                
            } catch (error) {
                console.error('Error cargando top performers:', error);
                document.getElementById('top-performers').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Cargar bottom performers
        async function cargarBottomPerformers() {
            try {
                const response = await fetch('/api/metrics/bottom-performers?limit=5');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.bottom_performers || !Array.isArray(data.bottom_performers)) {
                    throw new Error('Datos inválidos recibidos');
                }
                
                let html = '<ul class="list-group list-group-flush">';
                
                data.bottom_performers.forEach((performer, index) => {
                    const icon = index === 0 ? '💩' : index === 1 ? '👎' : index === 2 ? '😕' : '📉';
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="me-2">${icon}</span>
                                <strong>${performer.nombre}</strong>
                                <br><small class="text-muted">${performer.tipo}</small>
                            </div>
                            <span class="badge bg-danger rounded-pill">${performer.rendimiento.toFixed(2)}%</span>
                        </li>
                    `;
                });
                
                html += '</ul>';
                document.getElementById('bottom-performers').innerHTML = html;
                
            } catch (error) {
                console.error('Error cargando bottom performers:', error);
                document.getElementById('bottom-performers').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Cargar performance por ticker
        async function cargarTickerPerformance() {
            try {
                const response = await fetch('/api/metrics/performance-tickers');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.ticker_performance || !Array.isArray(data.ticker_performance)) {
                    throw new Error('Datos inválidos recibidos');
                }
                
                let html = '<ul class="list-group list-group-flush">';
                
                data.ticker_performance.forEach(ticker => {
                    const clase = getClaseValor(ticker.rendimiento, true);
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${ticker.ticker}</strong>
                                <br><small class="text-muted">${ticker.tipo}</small>
                            </div>
                            <span class="badge rounded-pill ${clase === 'text-success' ? 'bg-success' : clase === 'text-danger' ? 'bg-danger' : 'bg-muted'}">${ticker.rendimiento.toFixed(2)}%</span>
                        </li>
                    `;
                });
                
                html += '</ul>';
                document.getElementById('ticker-performance').innerHTML = html;
                
            } catch (error) {
                console.error('Error cargando ticker performance:', error);
                document.getElementById('ticker-performance').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Cargar métricas de riesgo
        async function cargarRiskMetrics() {
            try {
                const response = await fetch('/api/metrics/portfolio');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('La respuesta no es JSON válido');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Calcular métricas de riesgo básicas
                const sharpeRatio = data.rendimiento_percent > 0 ? (data.rendimiento_percent / 10) : 0;
                const varPromedio = data.rendimiento_percent < 0 ? Math.abs(data.rendimiento_percent) * 0.8 : 0;
                const maxDrawdown = data.rendimiento_percent < 0 ? Math.abs(data.rendimiento_percent) * 0.5 : 0;
                const volatilidad = data.rendimiento_percent !== 0 ? Math.sqrt(Math.abs(data.rendimiento_percent)) : 0;
                
                document.getElementById('risk-metrics').innerHTML = `
                    <div class="row">
                        <div class="col-md-3">
                            <div class="text-center">
                                <h6>Sharpe Ratio</h6>
                                <p class="h4">${sharpeRatio.toFixed(2)}</p>
                                <small class="text-muted">Ratio de Sharpe</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h6>VaR Promedio</h6>
                                <p class="h4 ${getClaseValor(-varPromedio, true)}">${varPromedio.toFixed(2)}%</p>
                                <small class="text-muted">Value at Risk</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h6>Max Drawdown</h6>
                                <p class="h4 ${getClaseValor(-maxDrawdown, true)}">${maxDrawdown.toFixed(2)}%</p>
                                <small class="text-muted">Pérdida máxima</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h6>Volatilidad</h6>
                                <p class="h4">${volatilidad.toFixed(2)}%</p>
                                <small class="text-muted">Volatilidad</small>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error cargando risk metrics:', error);
                document.getElementById('risk-metrics').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Función para recargar todo el dashboard
        async function recargarDashboard() {
            // Mostrar indicadores de carga
            document.querySelectorAll('#portfolio-summary, #top-performers, #bottom-performers, #ticker-performance, #risk-metrics').forEach(el => {
                el.innerHTML = `
                    <div class="text-center">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <p class="mt-2">Cargando...</p>
                    </div>
                `;
            });
            
            // Recargar todos los componentes
            await Promise.all([
                cargarKPIs(),
                cargarPortfolioSummary(),
                cargarTopPerformers(),
                cargarBottomPerformers(),
                cargarTickerPerformance(),
                cargarRiskMetrics()
            ]);
        }

        // Cargar dashboard al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            recargarDashboard();
            
            // Actualizar cada 5 minutos
            setInterval(recargarDashboard, 300000);
        });
    </script>
